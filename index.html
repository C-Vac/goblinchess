<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin Chess Showdown</title>
    
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- Chessboard.js CSS -->
    <link rel="stylesheet" href="chessboard.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --danger: #ef4444;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #0f172a !important;
            color: white !important;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            max-width: 1000px;
            width: 100%;
            padding: 2rem;
            box-sizing: border-box;
        }

        .board-container {
            flex: 1;
            max-width: 600px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .info-panel {
            width: 300px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--border-color);
        }

        .status-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .status-value {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .clocks {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .clock {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .clock.active {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .clock-name {
            font-weight: 500;
        }

        .clock-time {
            font-family: monospace;
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* Chessboard custom styling */
        .white-1e1d7 { background-color: #cbd5e1; }
        .black-3c85d { background-color: #475569; }
        .highlight1-32417, .highlight2-9c5d2 { background-color: rgba(59, 130, 246, 0.6); }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 1rem;
            }
            .info-panel {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>
    <h1 style="position:fixed; z-index:9999999; color: black; background: yellow; font-size: 48px; top: 0; left: 0;">IF YOU CAN READ THIS, THE IFRAME IS VISIBLE</h1>

    <div class="container">
        <div class="board-container">
            <div id="board"></div>
        </div>

        <div class="info-panel">
            <h1>Goblin Showdown</h1>
            
            <div class="status-box">
                <div class="status-label">Connection Status</div>
                <div id="conn-status" class="status-value" style="color: var(--text-muted);">Connecting...</div>
            </div>

            <div class="status-box">
                <div class="status-label">Game State</div>
                <div id="game-status" class="status-value">Waiting...</div>
            </div>

            <div class="clocks">
                <div id="clock-black" class="clock">
                    <div class="clock-name">Opponent</div>
                    <div id="time-black" class="clock-time">05:00</div>
                </div>
                <div id="clock-white" class="clock active">
                    <div class="clock-name">You</div>
                    <div id="time-white" class="clock-time">05:00</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="jquery.min.js"></script>
    <script src="chessboard.min.js"></script>
    <script src="chess.min.js"></script>

    <script>
        // FOOLPROOF ERROR REPORTER
        window.addEventListener('error', function(e) {
            const errBox = document.createElement('div');
            errBox.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:red;color:white;z-index:999999;padding:20px;font-family:monospace;font-size:24px;word-wrap:break-word;overflow-y:auto;';
            errBox.innerHTML = '<h1>FATAL ERROR</h1><p>' + e.message + '</p><p>' + e.filename + ':' + e.lineno + '</p>';
            document.body.appendChild(errBox);
        });
        window.addEventListener('unhandledrejection', function(e) {
            const errBox = document.createElement('div');
            errBox.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:red;color:white;z-index:999999;padding:20px;font-family:monospace;font-size:24px;word-wrap:break-word;overflow-y:auto;';
            errBox.innerHTML = '<h1>UNHANDLED PROMISE REJECTION</h1><p>' + (e.reason ? (e.reason.message || e.reason) : 'Unknown') + '</p>';
            document.body.appendChild(errBox);
        });
    </script>

    <script type="module">
        import { DiscordSDK } from "./discord-sdk.js";
        
        // Setup WebSockets and Board
        const connStatus = document.getElementById('conn-status');
        const gameStatus = document.getElementById('game-status');
        const timeWhite = document.getElementById('time-white');
        const timeBlack = document.getElementById('time-black');
        const clockWhite = document.getElementById('clock-white');
        const clockBlack = document.getElementById('clock-black');

        let board = null;
        let game = new Chess();
        let ws = null;
        let isMyTurn = false;
        let discordSdk = null;
        let gameId = null;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateClocks(humanTime, aiTime, isHumanTurn) {
            timeWhite.innerText = formatTime(humanTime);
            timeBlack.innerText = formatTime(aiTime);
            if (isHumanTurn) {
                clockWhite.classList.add('active');
                clockBlack.classList.remove('active');
            } else {
                clockBlack.classList.add('active');
                clockWhite.classList.remove('active');
            }
        }

        function connect() {
            if (!gameId) {
                connStatus.innerText = "Error: No game_id provided";
                connStatus.style.color = "var(--danger)";
                return;
            }

            // Connect to the Cloudflare tunnel via Discord Proxy if in iframe
            const urlParams = new URLSearchParams(window.location.search);
            const isDiscord = urlParams.has('frame_id');
            const CLIENT_ID = "1416651287163965471";
            
            let WS_BASE = "wss://ws.goblinlife.org";
            if (isDiscord) {
                WS_BASE = `wss://${CLIENT_ID}.discordsays.com/ws`;
            }
            const wsUrl = `${WS_BASE}/games/chess/ws/showdown`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                connStatus.innerText = "Connected";
                connStatus.style.color = "#22c55e"; // green
                ws.send(JSON.stringify({ action: "join", game_id: gameId }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === "error") {
                    gameStatus.innerText = data.message;
                    gameStatus.style.color = "var(--danger)";
                } else if (data.type === "state") {
                    game.load(data.fen);
                    board.position(data.fen);
                    
                    isMyTurn = data.is_human_turn;
                    updateClocks(data.human_time, data.ai_time, data.is_human_turn);
                    
                    if (data.game_over) {
                        gameStatus.innerText = data.reason;
                        isMyTurn = false;
                        clockWhite.classList.remove('active');
                        clockBlack.classList.remove('active');
                    } else {
                        gameStatus.innerText = isMyTurn ? "Your turn" : "Opponent thinking...";
                    }
                }
            };

            ws.onclose = () => {
                connStatus.innerText = "Disconnected";
                connStatus.style.color = "var(--danger)";
                setTimeout(connect, 3000); // try reconnect
            };
        }

        function onDragStart (source, piece, position, orientation) {
            // Do not pick up pieces if the game is over or not your turn
            if (game.game_over() || !isMyTurn) return false;
            // Only allow picking up white pieces
            if (piece.search(/^b/) !== -1) return false;
        }

        function onDrop (source, target) {
            // See if the move is legal
            const move = game.move({
                from: source,
                to: target,
                promotion: 'q' // NOTE: always promote to a queen for simplicity
            });

            // Illegal move
            if (move === null) return 'snapback';

            // Send move to server
            if (ws && ws.readyState === WebSocket.OPEN) {
                // We send the UCI format
                const uci = source + target + (move.promotion ? move.promotion : '');
                ws.send(JSON.stringify({ action: "move", uci: uci }));
                
                // Optimistically update status
                isMyTurn = false;
                gameStatus.innerText = "Opponent thinking...";
            } else {
                game.undo();
                return 'snapback';
            }
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        const config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };

        board = Chessboard('board', config);
        
        // Ensure board resizes correctly
        window.addEventListener('resize', board.resize);
        
        async function initDiscord() {
            try {
                connStatus.innerText = "Fetching config...";
                const urlParams = new URLSearchParams(window.location.search);
                const isDiscord = urlParams.has('frame_id');
                const CLIENT_ID = "1416651287163965471";
                
                let API_BASE = "https://ws.goblinlife.org";
                if (isDiscord) {
                    API_BASE = `https://${CLIENT_ID}.discordsays.com/ws`;
                }
                
                const res = await fetch(`${API_BASE}/games/chess/config`);
                const configData = await res.json();
                
                if (!configData.client_id) {
                    throw new Error("No client ID returned");
                }
                
                if (!isDiscord) {
                    console.log("No frame_id found. Running in browser testing mode.");
                    connStatus.innerText = "Browser Mode";
                    gameId = urlParams.get('game_id') || "test_game_123";
                    connect();
                    return;
                }
                
                discordSdk = new DiscordSDK(configData.client_id);
                connStatus.innerText = "Waiting for Discord...";
                await discordSdk.ready();
                
                connStatus.innerText = "Authorizing...";
                const { code } = await discordSdk.commands.authorize({
                    client_id: configData.client_id,
                    response_type: "code",
                    state: "",
                    prompt: "none",
                    scope: ["identify"]
                });

                gameId = discordSdk.channelId;
                if (!gameId) {
                    throw new Error("Could not get channel ID");
                }
                
                // Start connection
                connect();
            } catch (e) {
                connStatus.innerText = "Activity Error: " + e.message;
                connStatus.style.color = "var(--danger)";
                console.error(e);
            }
        }
        
        initDiscord();
    </script>
</body>
</html>
